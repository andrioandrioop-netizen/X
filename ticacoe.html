<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light dark">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Tic Tac Toe</title>

    <link rel="icon" href="assets/logo.png">

    <link rel="stylesheet" href="style.css">
<style>
/* ===== CONSISTENT SITE-WIDE HEADER ===== */
.site-header {
    position: sticky !important;
    top: 0;
    z-index: 9999;
    width: 100%;
    min-height: 72px;
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 12px 42px !important;
    margin: 0 !important;
    background: rgba(255,255,255,.96) !important;
    border-bottom: 1px solid #e5e7eb !important;
    box-shadow: 0 4px 18px rgba(15,23,42,.08) !important;
    backdrop-filter: blur(10px);
    box-sizing: border-box;
}
.site-logo {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    text-decoration: none !important;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 28px !important;
    line-height: 1;
    font-weight: 800 !important;
    color: #172033 !important;
    white-space: nowrap;
}
.site-logo span { color: #6366f1 !important; }
.site-header-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    min-width: 0;
}
.site-search {
    width: 190px;
    height: 40px;
    padding: 0 14px;
    border: 1px solid #dbe3ec;
    border-radius: 10px;
    outline: none;
    background: #f8fafc;
    color: #172033;
    font: 500 14px 'Poppins', 'Segoe UI', sans-serif;
    box-sizing: border-box;
}
.site-search:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,.12);
}
.site-nav {
    display: flex !important;
    align-items: center;
    gap: 24px;
    margin: 0 !important;
    padding: 0 !important;
}
.site-nav a {
    display: inline-flex !important;
    align-items: center;
    padding: 8px 2px;
    text-decoration: none !important;
    color: #374151 !important;
    font: 600 14px 'Poppins', 'Segoe UI', sans-serif !important;
    white-space: nowrap;
    transition: color .2s ease, transform .2s ease;
}
.site-nav a:hover,
.site-nav a.active {
    color: #6366f1 !important;
    transform: translateY(-1px);
}
.site-theme-toggle {
    height: 40px;
    padding: 0 15px;
    border: 1px solid #dbe3ec !important;
    border-radius: 10px;
    background: #172033 !important;
    color: #fff !important;
    cursor: pointer;
    font: 600 13px 'Poppins', 'Segoe UI', sans-serif !important;
    white-space: nowrap;
    transition: transform .2s ease, box-shadow .2s ease;
}
.site-theme-toggle:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(15,23,42,.15);
}
@media (max-width: 1050px) {
    .site-header { padding: 12px 22px !important; }
    .site-search { width: 150px; }
    .site-header-right { gap: 13px; }
    .site-nav { gap: 15px; }
}
@media (max-width: 820px) {
    .site-header { flex-wrap: wrap; justify-content: center; }
    .site-header-right { width: 100%; justify-content: center; flex-wrap: wrap; }
}
@media (max-width: 560px) {
    .site-search-wrap { display: none; }
    .site-nav { gap: 12px; flex-wrap: wrap; justify-content: center; }
    .site-nav a { font-size: 12px !important; }
    .site-logo { font-size: 24px !important; }
}
</style>
</head>
<body>

<!-- ================= NAVBAR ================= -->

<header class="site-header">
    <a class="site-logo" href="index.html">Nerds.<span>Hub</span></a>

    <div class="site-header-right">
        <div class="site-search-wrap">
            <input class="site-search" id="searchInput" type="text"
                   placeholder="Search practicals..." aria-label="Search practicals">
        </div>

        <nav class="site-nav" aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="ticacoe.html">TicTacToe</a>
            <a href="chess.html">Chess</a>
            <a href="us.html">About Us</a>
        </nav>

        <button class="site-theme-toggle" id="themeToggle" type="button"
                aria-label="Switch theme" title="Switch theme">
            Dark Mode
        </button>
    </div>
</header>

<!-- ================= LEFT DECORATION ================= -->

    
    <main>

    <!-- Title -->

    <section class="title-section">

        <h1>

            🐾 CAT <span>TIC TAC TOE</span> 🐾

        </h1>

        <p>

            Challenge your friends and improve your logic skills.

        </p>

    </section>

    <!-- Players -->

    <section class="players">

        <div class="player-card">

            <img src="1787051119718.png">

            <div>

                <h2>Player 1</h2>

                <p>Black Cat</p>

            </div>

        </div>

        <div class="vs">

            VS

        </div>

        <div class="player-card">

            <img src="1787051705719.png">

            <div>

                <h2>Player 2</h2>

                <p>Ginger Cat</p>

            </div>

        </div>

    </section>

    <!-- Turn -->

    <section class="turn-container">

        <div class="turn-box">

            🐾 Player 1's Turn (White Cat)

        </div>

    </section>

    <!-- Game -->

    <section class="game-area">

        <div class="board">

            <div class="cell" data-index="0"></div>

            <div class="cell" data-index="1"></div>

            <div class="cell" data-index="2"></div>

            <div class="cell" data-index="3"></div>

            <div class="cell" data-index="4"></div>

            <div class="cell" data-index="5"></div>

            <div class="cell" data-index="6"></div>

            <div class="cell" data-index="7"></div>

            <div class="cell" data-index="8"></div>

        </div>

    </section>

    <!-- Controls -->

    <section class="controls">

        <button id="restart">

            🐾 Restart Game

        </button>

    </section>

    <!-- Score -->

    <section class="scoreboard">

        <div class="score">

            <h3>Player 1</h3>

            <span id="score1">0</span>

        </div>

        <div class="score">

            <h3>Draws</h3>

            <span id="draws">0</span>

        </div>

        <div class="score">

            <h3>Player 2</h3>

            <span id="score2">0</span>

        </div>

    </section>

</main>

<!-- ================= RIGHT DECORATION ================= -->


<!-- ================= MAIN ================= -->


<!-- Winner Popup -->

<div class="popup" id="popup">

    <div class="popup-content">

        <h2 id="winnerText">

            Player 1 Wins!

        </h2>

        <button id="playAgain">

            Play Again

        </button>

    </div>

</div>

<!-- Footer -->
<footer>

    <p>

        Made with ❤️ and 🐾 by NerdHub

    </p>

</footer>

<script src="script.js"></script>

<script>
(function () {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  const saved = localStorage.getItem('nerdhub-theme');
  if (saved === 'dark') document.body.classList.add('dark');
  btn.addEventListener('click', function () {
    document.body.classList.toggle('dark');
    localStorage.setItem('nerdhub-theme',
      document.body.classList.contains('dark') ? 'dark' : 'light');
  });
})();
</script>
</body>
   
</div>
</html>
